<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Eagles Nest Veterans Equine Therapy – nonprofit equine services for veterans & families.">
  <title>ENVET – Eagles Nest Veterans Equine Therapy</title>
  <script>
  // Respect user choice, then system preference
  const user = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = user ? user === 'dark' : systemPrefersDark;
  if (dark) document.documentElement.classList.add('dark');
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
