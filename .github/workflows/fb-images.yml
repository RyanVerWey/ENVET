name: Refresh Facebook Images

on:
  schedule:
    - cron: "0 */12 * * *"  # every 12h
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/fetch-fb-images.mjs
        env:
          FB_PAGE_ID: "100068209587248"
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/facebook/manifest.json
          git commit -m "Refresh FB images"
          git push
