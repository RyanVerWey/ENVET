name: Review checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Smoke-test the built owner preview
        run: |
          npm run start > /tmp/envet-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          npm run test:preview
